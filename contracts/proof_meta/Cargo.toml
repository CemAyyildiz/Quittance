# Standalone crate, not a member of the ../Cargo.toml workspace (its
# `members` list doesn't include this directory). Without this empty
# `[workspace]` table, `cargo test` run from inside this directory fails
# with "current package believes it's in a workspace when it's not"
# instead of actually running the tests.
[workspace]

[package]
name        = "quittance-proof-meta"
version     = "0.1.0"
edition     = "2021"
description = "Pack/unpack a small proof metadata struct (amount, asset code, memo, tx hash bytes) for Soroban payment proofs."
license     = "MIT"
publish     = false

# This crate is intentionally dependency-free so it can be used both inside
# future Soroban contracts and in off-chain workers with no extra compile cost.

[lib]
crate-type = ["rlib"]
