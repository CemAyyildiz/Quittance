[workspace]

[package]
name = "seller-bind"
version = "0.1.0"
edition = "2021"
description = "Soroban helper contract: assert that a provided Stellar seller address matches a stored binding."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
