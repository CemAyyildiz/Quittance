[workspace]

[package]
name        = "fee-tier-lookup"
version     = "0.1.0"
edition     = "2021"
description = "Standalone Soroban contract: tiered fee lookup — resolves a basis-point fee for a payment amount from configurable brackets."
license     = "MIT"
publish     = false
readme      = "README.md"

[lib]
name       = "fee_tier_lookup"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
