[workspace]

[package]
name = "memo-validator"
version = "0.1.0"
edition = "2021"
description = "Soroban contract that validates Stellar text memos: max 28 bytes, printable ASCII charset only."
license = "MIT"
repository = "https://github.com/CemAyyildiz/Quittance"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
