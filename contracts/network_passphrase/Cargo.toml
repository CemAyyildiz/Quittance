[workspace]

[package]
name        = "network-passphrase"
version     = "0.1.0"
edition     = "2021"
description = "Soroban contract: expose Stellar testnet and public network passphrase constants via read-only functions."
license     = "MIT"
publish     = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
