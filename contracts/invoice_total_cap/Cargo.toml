[workspace]

[package]
name = "invoice-total-cap"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Soroban contract that tracks a running invoice total per seller and enforces an admin-configured cap."
license = "MIT"
readme = "README.md"
keywords = ["stellar", "soroban", "invoice", "cap", "quittance"]
categories = ["finance"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
