[workspace]

[package]
name = "dispute-resolution-outcome"
version = "0.1.0"
edition = "2021"
description = "Soroban contract recording a write-once, immutable dispute resolution outcome."
license = "MIT"
readme = "README.md"
keywords = ["stellar", "soroban", "dispute", "outcome", "quittance"]
categories = ["finance"]
publish = false

[lib]
name = "dispute_resolution_outcome"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
