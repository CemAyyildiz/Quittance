[workspace]

[package]
name = "multi-currency-invoice-tag"
version = "0.1.0"
edition = "2021"
description = "Soroban contract that tags an invoice with the single asset code it may be settled in and validates proposed payment assets against that tag."
license = "MIT"
readme = "README.md"
keywords = ["stellar", "soroban", "invoice", "currency", "quittance"]
categories = ["finance"]
publish = false

[lib]
name = "multi_currency_invoice_tag"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
