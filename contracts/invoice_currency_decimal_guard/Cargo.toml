[workspace]

[package]
name        = "invoice-currency-decimal-guard"
version     = "0.1.0"
edition     = "2021"
description = "Standalone Soroban contract: expected-decimals mismatch guard for invoice token payments."
license     = "MIT"
publish     = false
readme      = "README.md"

[lib]
name       = "invoice_currency_decimal_guard"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
