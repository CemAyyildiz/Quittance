[workspace]

[package]
name = "note-length-guard"
version = "0.1.0"
edition = "2021"
description = "Standalone Soroban contract for invoice note length and charset validation."
license = "MIT"
repository = "https://github.com/CemAyyildiz/Quittance"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1