[workspace]

[package]
name = "invoice-void-flag"
version = "0.1.0"
edition = "2021"
description = "Soroban contract implementing a one-time invoice void flag for unpaid, unexpired invoices."
license = "MIT"
readme = "README.md"
keywords = ["stellar", "soroban", "invoice", "void", "quittance"]
categories = ["finance"]
publish = false

[lib]
name = "invoice_void_flag"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
