[workspace]

[package]
name = "currency-decimals-registry"
version = "0.1.0"
edition = "2021"
description = "Admin-managed currency decimals registry for Soroban"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
