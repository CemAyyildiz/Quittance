[package]
name = "quittance-max-amount"
version = "0.1.0"
edition = "2021"
description = "Soroban contract that checks a payment amount against a configurable maximum ceiling in stroops."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
