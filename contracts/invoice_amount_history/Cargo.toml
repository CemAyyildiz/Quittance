[workspace]

[package]
name = "invoice-amount-history"
version = "0.1.0"
edition = "2021"
description = "Standalone Soroban append-only log of invoice amount adjustments"
license = "MIT"
publish = false
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
