# This crate is intentionally dependency-free so it can be reused both inside
# future Soroban contracts and in off-chain workers with no extra compile cost.

[workspace]

[package]
name        = "quittance-fee-bps-clamp"
version     = "0.1.0"
edition     = "2021"
description = "Pure helper: clamp a basis-points value into the valid 0..=10000 range. Not wired into Quittance payments."
license     = "MIT"
publish     = false

[lib]
crate-type = ["rlib"]
