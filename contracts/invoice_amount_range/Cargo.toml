[workspace]

[package]
name        = "invoice-amount-range"
version     = "0.1.0"
edition     = "2021"
description = "Standalone Soroban contract: per-seller invoice amount range validator."
license     = "MIT"
publish     = false
readme      = "README.md"

[lib]
name       = "invoice_amount_range"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level        = "z"
overflow-checks  = true
debug            = 0
strip            = "symbols"
debug-assertions = false
panic            = "abort"
codegen-units    = 1
lto              = true
