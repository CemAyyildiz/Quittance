[workspace]

[package]
name = "invoice-template-registry"
version = "0.1.0"
edition = "2021"
description = "Soroban contract providing a per-seller reusable invoice template registry."
license = "MIT"
readme = "README.md"
keywords = ["stellar", "soroban", "invoice", "template", "quittance"]
categories = ["finance"]
publish = false

[lib]
name = "invoice_template_registry"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
