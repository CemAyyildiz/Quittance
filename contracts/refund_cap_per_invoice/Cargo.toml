[workspace]

[package]
name        = "refund-cap-per-invoice"
version     = "0.1.0"
edition     = "2021"
description = "Standalone Soroban contract: tracks cumulative refunds per invoice and enforces original payment cap."
license     = "MIT"
publish     = false
readme      = "README.md"

[lib]
name       = "refund_cap_per_invoice"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
