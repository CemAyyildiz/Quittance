name: contracts

# Path-filtered so PRs that only change the app frontend or backend
# cannot fail this workflow. Runs when anything under contracts/ (or
# this file itself) is modified on main or on a pull request targeting
# main. workflow_dispatch allows an explicit manual trigger.
on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: make fmt

      - name: Run clippy
        run: make clippy

      - name: Run tests
        run: make test
