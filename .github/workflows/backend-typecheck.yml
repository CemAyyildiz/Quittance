# Backend TypeScript type-check workflow
#
# Runs `tsc --noEmit` on the backend on every PR to catch type errors
# before they land.

name: Backend TypeCheck

on:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
